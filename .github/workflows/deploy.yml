# Deploy static site to GitHub Pages
name: Deploy Static Content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job: package site and upload the required "github-pages" artifact
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare publish folder
        run: |
          mkdir -p _site
          # Copy site files only — skip git metadata, Actions config, and local tooling
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude '.taste-skill/' \
            --exclude 'scratch/' \
            --exclude 'seo/' \
            --exclude 'node_modules/' \
            --exclude '.gitignore' \
            ./ _site/
          # Required so GitHub Pages does not run Jekyll on the static HTML
          touch _site/.nojekyll
          test -f CNAME && cp CNAME _site/CNAME || true
          ls -la _site | head -40

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          include-hidden-files: true

  # Deploy job: must run after build so the artifact exists in this workflow run
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
